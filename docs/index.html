<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>cpro // notes</title>
<meta name="theme-color" content="#120f0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="grain"></div>
<div class="app">

  <div class="topbar">
    <div class="brand"><span class="cursor"></span><h1>c<span>pro</span>.notes</h1></div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="filter files…" autocomplete="off">
    </div>
    <div class="topbar-right">
      <span class="status" id="status">connecting…</span>
      <button class="iconbtn" id="modeToggle" aria-label="toggle theme">☾</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="body-grid">
    <nav class="sidebar" id="sidebar"></nav>
    <main>
      <div class="pagehead">
        <div class="desc" id="pageDesc"></div>
        <div class="linecount" id="lineCount"></div>
      </div>
      <div id="content"><div class="empty"><div class="spin"></div><div>pulling files from github…</div></div></div>
    </main>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/highlight.js"></script>
<script src="js/notesParser.js"></script>
<script src="js/github.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
